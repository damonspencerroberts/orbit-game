name: Build weekly puzzles
on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check imagery server is reachable
        run: curl -4 -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "https://tiles.maps.eox.at/wms?service=WMS&request=GetCapabilities" || true
      - run: python scripts/build_week.py
      - run: |
          git config user.name "puzzle-bot"
          git config user.email "puzzle-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add weekly puzzles"
          git push